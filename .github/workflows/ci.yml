# CI de m13 — typecheck + tests + build de examples + guard de peso del bundle.
#
# Notas:
# - pnpm/action-setup SIN version explícita: lee `packageManager` (pnpm@9.15.9)
#   del package.json raíz. Una sola fuente de verdad.
# - El build usa --filter @m13/examples a propósito: `pnpm build` del root corre
#   -r build en TODOS los packages y el editor (Next.js) es pesado/frágil en CI.
#   El typecheck sí cubre el monorepo completo, editor incluido.
# - Size check (T-070): el chunk m13-runtime-*.js hoy pesa ~40KB raw; el límite
#   de 60KB es un guard contra regresiones de peso, no un target.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (todo el monorepo)
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # B2 (auditoría 06-12): el JSON Schema exportado se desincronizó del Zod
      # real y le enseñó un formato viejo al editor LLM. Este guard lo hace
      # imposible: si schema.ts cambia sin regenerar, CI truena.
      - name: JSON Schema drift-guard (B2)
        run: |
          pnpm gen:schema
          git diff --exit-code m13-spec/v0.1.schema.json || {
            echo "::error::m13-spec/v0.1.schema.json desincronizado — corre 'pnpm gen:schema' y commitea"; exit 1; }

      # Contrato con phi-main (auditoría 06-12): phi-main genera escenas contra
      # el espejo m13_concepts.json. Conceptos nuevos/renombrados sin regenerar
      # el espejo = phi-main emite escenas inválidas.
      - name: Concepts mirror drift-guard (contrato phi-main)
        run: |
          pnpm export-concepts
          git diff --exit-code m13-spec/m13_concepts.json || {
            echo "::error::m13-spec/m13_concepts.json desincronizado — corre 'pnpm export-concepts' y commitea"; exit 1; }

      - name: Build examples
        run: pnpm --filter @m13/examples build

      - name: Size check del bundle m13-runtime (límite 60KB raw)
        run: |
          set -euo pipefail
          LIMIT=61440  # 60KB en bytes

          FILE=$(find packages/examples/dist/assets -maxdepth 1 -name 'm13-runtime-*.js' -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No se encontró packages/examples/dist/assets/m13-runtime-*.js — ¿cambió el manualChunks del vite.config?"
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")
          echo "Bundle: $FILE"
          echo "Peso raw: $SIZE bytes ($(( SIZE / 1024 ))KB) — límite: $LIMIT bytes (60KB)"

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Regresión de peso: $SIZE bytes > $LIMIT bytes. El runtime debe mantenerse liviano (tesis asset-light)."
            exit 1
          fi
          echo "Size check OK"
