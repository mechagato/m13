<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Agent — 6 Variant Showroom</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --border: #1c1c1c;
  --muted: #3a3a3a;
  --dim: #555;
}

body {
  background: var(--bg);
  color: #ccc;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  min-height: 100vh;
  padding: 52px 28px 80px;
}

/* ── PAGE HEADER ── */
.ph { text-align: center; margin-bottom: 44px; }
.ph-eyebrow {
  font-family: 'Space Mono', monospace;
  font-size: 9px; letter-spacing: 0.28em;
  text-transform: uppercase; color: #444;
  margin-bottom: 10px;
}
.ph-title {
  font-family: 'Space Mono', monospace;
  font-size: clamp(15px, 2.4vw, 24px);
  font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: #fff;
}
.ph-sub {
  margin-top: 8px; font-size: 11px;
  color: var(--dim); letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ── SPEED BAR ── */
.spd {
  display: flex; align-items: center; gap: 14px;
  justify-content: center; margin-bottom: 38px;
}
.spd-label { font-family: 'Space Mono', monospace; font-size: 9px; color: #3a3a3a; letter-spacing: 0.18em; }
.spd-btns { display: flex; gap: 3px; }
.spd-btn {
  font-family: 'Space Mono', monospace; font-size: 9px;
  padding: 4px 14px; border: 1px solid #1e1e1e;
  background: transparent; color: #444;
  cursor: pointer; letter-spacing: 0.08em; transition: all 0.12s;
}
.spd-btn:hover { border-color: #444; color: #999; }
.spd-btn.on { border-color: #fff; background: #fff; color: #000; }

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px; max-width: 1180px; margin: 0 auto;
}
@media (max-width: 880px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }

/* ── CELL CHROME ── */
.cell {
  border: 1px solid var(--border);
  display: flex; flex-direction: column;
  height: 450px; overflow: hidden;
}
.cell-hdr {
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.cell-name {
  font-family: 'Space Mono', monospace; font-size: 9px;
  font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
}
.cell-tag { font-size: 8px; letter-spacing: 0.1em; opacity: 0.45; font-family: 'Space Mono', monospace; }
.cell-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.cell-foot {
  padding: 6px 14px; border-top: 1px solid var(--border);
  font-family: 'Space Mono', monospace; font-size: 8px;
  letter-spacing: 0.12em; text-transform: uppercase;
  display: flex; align-items: center; gap: 7px;
  flex-shrink: 0;
}
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  transition: background 0.3s;
}

/* ── KEYFRAMES ── */
@keyframes blink     { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes stepBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

@keyframes pulse {
  0%,100% { opacity:0.25; transform:scale(0.75); }
  50%      { opacity:1;    transform:scale(1.15); }
}

@keyframes breatheDot {
  0%,100% { opacity:0.2; transform:scale(0.7); }
  50%      { opacity:1;   transform:scale(1);   }
}

@keyframes wordFloat {
  0%   { transform:translateY(9px); opacity:0; }
  100% { transform:translateY(0);   opacity:1; }
}

@keyframes wordSlam {
  0%   { transform:translateY(18px) scaleY(1.4); opacity:0; }
  55%  { transform:translateY(-3px) scaleY(0.93); opacity:1; }
  100% { transform:translateY(0) scaleY(1); opacity:1; }
}

@keyframes wordDrift {
  0%   { transform:translateY(12px); opacity:0; filter:blur(3px); }
  100% { transform:translateY(0);   opacity:1; filter:blur(0);   }
}

@keyframes glitchShift {
  0%,87%,100% { transform:translateX(0); }
  88% { transform:translateX(-3px); }
  90% { transform:translateX(4px); }
  92% { transform:translateX(-1px); }
  94% { transform:translateX(2px); }
}

@keyframes scanPulse {
  0%,100% { opacity:0.025; }
  50%      { opacity:0.055; }
}

@keyframes barStretch {
  0%,100% { width:16px; opacity:0.35; }
  50%      { width:72px; opacity:1; }
}

@keyframes fadeUp {
  0%   { opacity:0; transform:translateY(5px); }
  100% { opacity:1; transform:translateY(0);   }
}

@keyframes orbitSpin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── COPY ── */
const Q = "What makes the universe infinite?";
const A = "The universe expands faster than light can traverse it — so any boundary we could reach keeps receding. Infinity isn't a place; it's a horizon that moves with you.";

/* ── PHASE ── */
const P = { IDLE:'idle', USER:'user', THINK:'think', STREAM:'stream', DONE:'done' };

const STATE_LABEL = {
  idle:'—', user:'user typing', think:'thinking', stream:'streaming', done:'complete'
};

/* ═══════════════════════════════════════
   CORE LOOP HOOK
═══════════════════════════════════════ */
function useLoop(initDelay = 0, speed = 1) {
  const [ready,  setReady]  = useState(false);
  const [phase,  setPhase]  = useState(P.IDLE);
  const [uLen,   setULen]   = useState(0);
  const [aLen,   setALen]   = useState(0);

  const d = ms => Math.max(16, Math.round(ms / speed));

  /* one-time start delay */
  useEffect(() => {
    const t = setTimeout(() => setReady(true), initDelay);
    return () => clearTimeout(t);
  }, []); // eslint-disable-line

  /* IDLE → USER */
  useEffect(() => {
    if (!ready || phase !== P.IDLE) return;
    const t = setTimeout(() => { setULen(0); setALen(0); setPhase(P.USER); }, d(750));
    return () => clearTimeout(t);
  }, [ready, phase, speed]);

  /* USER typing */
  useEffect(() => {
    if (phase !== P.USER) return;
    if (uLen >= Q.length) {
      const t = setTimeout(() => setPhase(P.THINK), d(550));
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setULen(l => l + 1), d(28));
    return () => clearTimeout(t);
  }, [phase, uLen, speed]);

  /* THINK → STREAM */
  useEffect(() => {
    if (phase !== P.THINK) return;
    const t = setTimeout(() => { setALen(0); setPhase(P.STREAM); }, d(2300));
    return () => clearTimeout(t);
  }, [phase, speed]);

  /* STREAM chars */
  useEffect(() => {
    if (phase !== P.STREAM) return;
    if (aLen >= A.length) {
      const t = setTimeout(() => setPhase(P.DONE), d(350));
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setALen(l => l + 1), d(12));
    return () => clearTimeout(t);
  }, [phase, aLen, speed]);

  /* DONE → IDLE */
  useEffect(() => {
    if (phase !== P.DONE) return;
    const t = setTimeout(() => setPhase(P.IDLE), d(2600));
    return () => clearTimeout(t);
  }, [phase, speed]);

  return {
    phase,
    userText:   Q.slice(0, uLen),
    answerText: A.slice(0, aLen),
  };
}

/* ── WORD HELPERS ── */
function completeWords(text) {
  const n = (text.match(/\S+ /g) || []).length;
  return A.split(' ').slice(0, n);
}
function partialWord(text) {
  const cw = completeWords(text);
  const used = cw.join(' ');
  return text.slice(used.length + (cw.length > 0 ? 1 : 0));
}

/* ── GLITCH CHARS ── */
const GC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%▓▒░█▄▀■';
const randStr = n => Array.from({length:n}, () => GC[Math.floor(Math.random()*GC.length)]).join('');

/* ═══════════════════════════════════════
   CELL WRAPPER
═══════════════════════════════════════ */
function Cell({ name, tag, phase, bg, fg, borderCol, footBg, children }) {
  const dotColor = {
    idle:'#2a2a2a', user:'#666', think:'#aaa', stream:'#ddd', done:'#444'
  }[phase];
  const dotAnim = phase === P.THINK ? 'pulse 1s ease-in-out infinite'
                : phase === P.STREAM ? 'pulse 0.5s ease-in-out infinite'
                : 'none';

  return (
    <div className="cell" style={{ borderColor: borderCol || 'var(--border)' }}>
      <div className="cell-hdr" style={{ background: bg || '#0d0d0d', borderColor: borderCol || 'var(--border)' }}>
        <span className="cell-name" style={{ color: fg || '#fff' }}>{name}</span>
        <span className="cell-tag"  style={{ color: fg || '#fff' }}>{tag}</span>
      </div>
      <div className="cell-body">{children}</div>
      <div className="cell-foot" style={{ background: footBg || '#090909', borderColor: borderCol || 'var(--border)', color: fg ? fg + '55' : '#444' }}>
        <div className="dot" style={{ background: dotColor, animation: dotAnim }} />
        {STATE_LABEL[phase]}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   1 · TERMINAL
   char-by-char · block cursor · dot-dots
═══════════════════════════════════════ */
function Terminal({ speed }) {
  const { phase, userText, answerText } = useLoop(0, speed);
  const [dots, setDots] = useState('');

  useEffect(() => {
    if (phase !== P.THINK) { setDots(''); return; }
    let i = 0;
    const iv = setInterval(() => { setDots('.'.repeat((i++ % 3) + 1)); }, 420);
    return () => clearInterval(iv);
  }, [phase]);

  const Cursor = () => (
    <span style={{
      display:'inline-block', width:7, height:'1em',
      background:'#d4d4d4', verticalAlign:'middle', marginLeft:1,
      animation:'stepBlink 0.8s step-start infinite'
    }} />
  );

  return (
    <Cell name="Terminal" tag="char · cursor" phase={phase} bg="#050505" footBg="#050505">
      <div style={{
        background:'#040404', color:'#d4d4d4',
        fontFamily:"'Space Mono', monospace",
        fontSize:12, lineHeight:1.8,
        padding:'16px 18px', flex:1,
        display:'flex', flexDirection:'column', gap:10,
        overflowY:'auto'
      }}>
        {userText && (
          <div>
            <span style={{color:'#3a3a3a'}}>❯ </span>
            <span style={{color:'#777'}}>you  </span>
            <span>{userText}</span>
            {phase === P.USER && <Cursor />}
          </div>
        )}
        {[P.THINK, P.STREAM, P.DONE].includes(phase) && (
          <div>
            <span style={{color:'#3a3a3a'}}>❯ </span>
            <span style={{color:'#777'}}>agent</span>
            {' '}
            {phase === P.THINK && (
              <span style={{color:'#555'}}>
                PROCESSING<span style={{display:'inline-block', minWidth:20, letterSpacing:2}}>{dots}</span>
              </span>
            )}
            {[P.STREAM, P.DONE].includes(phase) && (
              <>
                {answerText}
                {phase === P.STREAM && <Cursor />}
              </>
            )}
          </div>
        )}
      </div>
    </Cell>
  );
}

/* ═══════════════════════════════════════
   2 · WHISPER
   bubbles · 3-dot loader · word-float
═══════════════════════════════════════ */
function Whisper({ speed }) {
  const { phase, userText, answerText } = useLoop(520, speed);
  const cw  = completeWords(answerText);
  const pw  = partialWord(answerText);

  const Avatar = () => (
    <div style={{
      width:28, height:28, borderRadius:'50%', background:'#111',
      flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center'
    }}>
      <div style={{width:9, height:9, borderRadius:'50%', background:'#ccc'}} />
    </div>
  );

  return (
    <Cell name="Whisper" tag="word · float" phase={phase}
      bg="#f4f4f2" fg="#111" borderCol="#ddddd8" footBg="#ebebea">
      <div style={{
        background:'#f4f4f2', color:'#111',
        fontFamily:'system-ui,-apple-system,sans-serif',
        fontSize:13, padding:'14px 12px', flex:1,
        display:'flex', flexDirection:'column', gap:12, overflowY:'auto'
      }}>
        {userText && (
          <div style={{display:'flex', justifyContent:'flex-end'}}>
            <div style={{
              background:'#111', color:'#f0f0f0',
              borderRadius:'20px 20px 3px 20px',
              padding:'9px 14px', maxWidth:'82%', lineHeight:1.55
            }}>
              {userText}
              {phase === P.USER && <span style={{opacity:0.5, animation:'blink 0.8s ease infinite', marginLeft:1}}>|</span>}
            </div>
          </div>
        )}
        {[P.THINK, P.STREAM, P.DONE].includes(phase) && (
          <div style={{display:'flex', alignItems:'flex-end', gap:8}}>
            <Avatar />
            <div style={{
              background:'#fff', borderRadius:'3px 20px 20px 20px',
              padding:'10px 14px', maxWidth:'82%', lineHeight:1.7,
              boxShadow:'0 1px 5px rgba(0,0,0,0.06)'
            }}>
              {phase === P.THINK && (
                <div style={{display:'flex', gap:5, alignItems:'center', padding:'3px 0'}}>
                  {[0,1,2].map(i => (
                    <div key={i} style={{
                      width:7, height:7, borderRadius:'50%', background:'#bbb',
                      animation:`breatheDot 1.2s ease-in-out ${i*0.19}s infinite`
                    }} />
                  ))}
                </div>
              )}
              {[P.STREAM, P.DONE].includes(phase) && (
                <div style={{color:'#1a1a1a'}}>
                  {cw.map((w,i) => (
                    <span key={i} style={{
                      display:'inline-block', marginRight:'0.28em',
                      animation:'wordFloat 0.28s ease forwards'
                    }}>{w}</span>
                  ))}
                  {pw && <span style={{opacity:0.35}}>{pw}</span>}
                  {phase === P.STREAM && !pw && (
                    <span style={{animation:'blink 0.8s ease infinite', opacity:0.4, marginLeft:1}}>|</span>
                  )}
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </Cell>
  );
}

/* ═══════════════════════════════════════
   3 · BRUTAL
   stark b/w · square-wave thinking · slam words
═══════════════════════════════════════ */
function Brutal({ speed }) {
  const { phase, userText, answerText } = useLoop(1100, speed);
  const cw = completeWords(answerText);
  const pw = partialWord(answerText);

  return (
    <Cell name="Brutal" tag="word · slam" phase={phase}
      bg="#fff" fg="#000" borderCol="#d0d0d0" footBg="#efefef">
      <div style={{
        background:'#fff', color:'#000',
        fontFamily:"'Space Mono', monospace",
        fontSize:13, padding:'18px 20px', flex:1,
        display:'flex', flexDirection:'column', gap:16, overflowY:'auto'
      }}>
        {userText && (
          <div>
            <div style={{
              fontSize:7, letterSpacing:'0.25em', fontWeight:700,
              marginBottom:6, color:'#bbb'
            }}>YOU</div>
            <div style={{fontSize:18, fontWeight:700, lineHeight:1.2, letterSpacing:'-0.02em'}}>
              {userText}
              {phase === P.USER && <span style={{animation:'stepBlink 0.7s step-start infinite'}}>█</span>}
            </div>
          </div>
        )}
        {[P.THINK, P.STREAM, P.DONE].includes(phase) && (
          <div>
            <div style={{
              fontSize:7, letterSpacing:'0.25em', fontWeight:700,
              marginBottom:8, color:'#bbb'
            }}>AGENT</div>
            {phase === P.THINK && (
              <div style={{display:'flex', gap:5, alignItems:'center'}}>
                {[0,1,2,3,4,5,6,7].map(i => (
                  <div key={i} style={{
                    width:11, height:11, background:'#000',
                    animation:`pulse 0.65s ease-in-out ${i*0.07}s infinite`
                  }} />
                ))}
              </div>
            )}
            {[P.STREAM, P.DONE].includes(phase) && (
              <div style={{lineHeight:1.45, fontSize:13, fontWeight:400}}>
                {cw.map((w,i) => (
                  <span key={i} style={{
                    display:'inline-block', marginRight:'0.35em',
                    transformOrigin:'bottom center',
                    animation:'wordSlam 0.22s cubic-bezier(0.22,1,0.36,1) forwards'
                  }}>{w}</span>
                ))}
                {pw && <span style={{opacity:0.25}}>{pw}</span>}
                {phase === P.STREAM && <span style={{animation:'stepBlink 0.7s step-start infinite'}}>█</span>}
              </div>
            )}
          </div>
        )}
      </div>
    </Cell>
  );
}

/* ═══════════════════════════════════════
   4 · GLITCH
   scanlines · random-char scramble · char stream
═══════════════════════════════════════ */
function Glitch({ speed }) {
  const { phase, userText, answerText } = useLoop(1700, speed);
  const [gStr, setGStr] = useState('');

  useEffect(() => {
    if (phase !== P.THINK) { setGStr(''); return; }
    const iv = setInterval(() => setGStr(randStr(20 + Math.floor(Math.random()*12))), 65);
    return () => clearInterval(iv);
  }, [phase]);

  return (
    <Cell name="Glitch" tag="scramble · noise" phase={phase} bg="#06060a" footBg="#05050a">
      <div style={{
        background:'#05050a', color:'#e0e0e0',
        fontFamily:"'Space Mono', monospace",
        fontSize:12, padding:'16px 18px', flex:1,
        display:'flex', flexDirection:'column', gap:12,
        overflowY:'auto', position:'relative', lineHeight:1.75
      }}>
        {/* scanlines */}
        <div style={{
          position:'absolute', inset:0, pointerEvents:'none', zIndex:1,
          backgroundImage:'repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.022) 2px, rgba(255,255,255,0.022) 3px)',
          animation:'scanPulse 5s ease-in-out infinite'
        }} />

        <div style={{position:'relative', zIndex:2, display:'flex', flexDirection:'column', gap:10}}>
          {userText && (
            <div>
              <span style={{color:'#383838', fontSize:9, letterSpacing:'0.18em'}}>USR:// </span>
              <span style={{color:'#bbb'}}>{userText}</span>
              {phase === P.USER && (
                <span style={{color:'#fff', animation:'stepBlink 0.55s step-start infinite'}}>_</span>
              )}
            </div>
          )}
          {[P.THINK, P.STREAM, P.DONE].includes(phase) && (
            <div style={{animation: phase === P.STREAM ? 'glitchShift 2.5s ease-in-out infinite' : 'none'}}>
              <span style={{color:'#383838', fontSize:9, letterSpacing:'0.18em'}}>AGT:// </span>
              {phase === P.THINK && (
                <span style={{color:'#484848', fontSize:11, wordBreak:'break-all', letterSpacing:'0.04em'}}>
                  {gStr}
                </span>
              )}
              {[P.STREAM, P.DONE].includes(phase) && (
                <>
                  <span style={{color:'#d8d8d8'}}>{answerText}</span>
                  {phase === P.STREAM && (
                    <span style={{color:'#fff', animation:'stepBlink 0.55s step-start infinite'}}>_</span>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      </div>
    </Cell>
  );
}

/* ═══════════════════════════════════════
   5 · SIGNAL
   waveform bars thinking · char stream below
═══════════════════════════════════════ */
function Signal({ speed }) {
  const { phase, userText, answerText } = useLoop(2350, speed);
  const [bars, setBars] = useState(() => Array(24).fill(0.12));

  useEffect(() => {
    if (phase !== P.THINK && phase !== P.STREAM) {
      setBars(Array(24).fill(0.12)); return;
    }
    const iv = setInterval(() => {
      setBars(prev => prev.map(() =>
        phase === P.THINK
          ? 0.1 + Math.random() * 0.9
          : 0.06 + Math.random() * 0.3
      ));
    }, 85);
    return () => clearInterval(iv);
  }, [phase]);

  return (
    <Cell name="Signal" tag="waveform · stream" phase={phase} bg="#09090f" footBg="#07070e">
      <div style={{
        background:'#07070d', color:'#ccc',
        fontFamily:"'Space Grotesk', system-ui, sans-serif",
        fontSize:13, padding:'14px 16px', flex:1,
        display:'flex', flexDirection:'column', gap:14, overflowY:'auto'
      }}>
        {userText && (
          <div style={{display:'flex', justifyContent:'flex-end'}}>
            <div style={{
              background:'#1a1a26', borderRadius:'13px 13px 2px 13px',
              padding:'9px 14px', maxWidth:'80%', lineHeight:1.55,
              color:'#ddd', border:'1px solid #282835'
            }}>
              {userText}
              {phase === P.USER && (
                <span style={{opacity:0.45, animation:'blink 0.8s ease infinite', marginLeft:1}}>|</span>
              )}
            </div>
          </div>
        )}
        {[P.THINK, P.STREAM, P.DONE].includes(phase) && (
          <div>
            {(phase === P.THINK || phase === P.STREAM) && (
              <div style={{
                display:'flex', alignItems:'center', gap:2,
                height: phase === P.THINK ? 42 : 14,
                marginBottom:10, transition:'height 0.5s ease'
              }}>
                {bars.map((h, i) => (
                  <div key={i} style={{
                    flex:1, background: phase === P.THINK ? '#ddd' : '#444',
                    borderRadius:1,
                    height:`${Math.max(3, h*100)}%`,
                    transition:'height 0.08s ease, background 0.5s ease'
                  }} />
                ))}
              </div>
            )}
            {[P.STREAM, P.DONE].includes(phase) && (
              <div style={{lineHeight:1.7, color:'#ddd', animation:'fadeUp 0.3s ease forwards'}}>
                {answerText}
                {phase === P.STREAM && (
                  <span style={{animation:'blink 0.9s ease infinite', opacity:0.7, marginLeft:1}}>▌</span>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </Cell>
  );
}

/* ═══════════════════════════════════════
   6 · FOLIO
   serif editorial · pulse-line thinking · word drift
═══════════════════════════════════════ */
function Folio({ speed }) {
  const { phase, userText, answerText } = useLoop(2950, speed);
  const cw = completeWords(answerText);
  const pw = partialWord(answerText);

  return (
    <Cell name="Folio" tag="serif · drift" phase={phase}
      bg="#eee8df" fg="#1a1a1a" borderCol="#ccc8be" footBg="#e7e1d8">
      <div style={{
        background:'#f0ebe1', color:'#1a1a1a',
        fontFamily:"'Playfair Display', Georgia, serif",
        fontSize:14, padding:'22px 20px', flex:1,
        display:'flex', flexDirection:'column', gap:20, overflowY:'auto'
      }}>
        {userText && (
          <div style={{borderLeft:'1.5px solid #bbb', paddingLeft:14}}>
            <div style={{
              fontFamily:'system-ui', fontSize:7.5,
              letterSpacing:'0.22em', color:'#aaa',
              marginBottom:6, textTransform:'uppercase'
            }}>Query</div>
            <div style={{fontStyle:'italic', lineHeight:1.65, color:'#444', fontSize:14}}>
              "{userText}
              {phase === P.USER && (
                <span style={{animation:'blink 1s ease infinite', fontStyle:'normal', fontFamily:'monospace', fontSize:12}}>|</span>
              )}"
            </div>
          </div>
        )}
        {[P.THINK, P.STREAM, P.DONE].includes(phase) && (
          <div>
            <div style={{
              fontFamily:'system-ui', fontSize:7.5,
              letterSpacing:'0.22em', color:'#aaa',
              marginBottom:12, textTransform:'uppercase'
            }}>Response</div>
            {phase === P.THINK && (
              <div>
                <div style={{
                  height:1, background:'#555', borderRadius:1,
                  animation:'barStretch 1.5s ease-in-out infinite',
                  minWidth:10
                }} />
                <div style={{
                  marginTop:8,
                  fontFamily:'system-ui', fontSize:9,
                  letterSpacing:'0.14em', color:'#aaa',
                  textTransform:'uppercase'
                }}>composing</div>
              </div>
            )}
            {[P.STREAM, P.DONE].includes(phase) && (
              <div style={{lineHeight:1.9}}>
                {cw.map((w,i) => (
                  <span key={i} style={{
                    display:'inline-block', marginRight:'0.28em',
                    animation:'wordDrift 0.38s ease forwards'
                  }}>{w}</span>
                ))}
                {pw && (
                  <span style={{
                    opacity:0.3, fontFamily:'system-ui',
                    fontSize:12, fontStyle:'normal'
                  }}>{pw}</span>
                )}
                {phase === P.STREAM && !pw && (
                  <span style={{
                    animation:'blink 1s ease infinite',
                    fontStyle:'normal', fontFamily:'monospace', fontSize:12, opacity:0.5
                  }}>|</span>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </Cell>
  );
}

/* ═══════════════════════════════════════
   SPEED BAR
═══════════════════════════════════════ */
function SpeedControl({ speed, setSpeed }) {
  const opts = [{v:0.5,l:'0.5×'},{v:1,l:'1×'},{v:2,l:'2×'},{v:3,l:'3×'}];
  return (
    <div className="spd">
      <span className="spd-label">PLAYBACK</span>
      <div className="spd-btns">
        {opts.map(o => (
          <button key={o.v} className={`spd-btn${speed===o.v?' on':''}`} onClick={() => setSpeed(o.v)}>
            {o.l}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   APP
═══════════════════════════════════════ */
function App() {
  const [speed, setSpeed] = useState(1);
  return (
    <div>
      <div className="ph">
        <div className="ph-eyebrow">Chat Agent Animation System</div>
        <div className="ph-title">6 Interface Variants</div>
        <div className="ph-sub">idle · typing · thinking · streaming · complete · loop</div>
      </div>
      <SpeedControl speed={speed} setSpeed={setSpeed} />
      <div className="grid">
        <Terminal speed={speed} />
        <Whisper  speed={speed} />
        <Brutal   speed={speed} />
        <Glitch   speed={speed} />
        <Signal   speed={speed} />
        <Folio    speed={speed} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
